<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Järnpakten – vidunderbokmärke</title>
<style>body{font:16px system-ui;max-width:850px;margin:35px auto;padding:0 18px;background:#11151a;color:#e7e7e7}label{display:block;margin-top:18px;font-weight:700}input,textarea{box-sizing:border-box;width:100%;padding:10px;margin-top:6px;background:#20262d;color:#fff;border:1px solid #46505b;border-radius:6px}textarea{height:170px}button{margin-top:20px;padding:12px 18px;font-weight:700}code{word-break:break-all}.box{margin-top:20px;padding:15px;background:#20262d;border-radius:6px}</style></head>
<body><h1>Vidunderbot – bokmärkesgenerator</h1>
<label>Railway-adress<input id="url" placeholder="https://din-service.up.railway.app"></label>
<label>UPDATE_SECRET<input id="secret" type="password"></label>
<label>Discord-kopplingar – en per rad: Profilnamn=Discord-ID<textarea id="mentions" placeholder="Dueex=123456789012345678&#10;Jool=123456789012345678"></textarea></label>
<button id="make">Skapa bokmärkeskod</button>
<div class="box"><strong>Kod:</strong><br><code id="output">Fyll i uppgifterna och klicka på knappen.</code></div>
<script>
document.getElementById("make").onclick=()=>{
  const cfg={url:document.getElementById("url").value.trim().replace(/\/$/,""),secret:document.getElementById("secret").value,mentions:{}};
  document.getElementById("mentions").value.split(/\r?\n/).forEach(line=>{const i=line.indexOf("=");if(i>0)cfg.mentions[line.slice(0,i).trim()]=line.slice(i+1).trim()});
  if(!cfg.url||!cfg.secret)return alert("Railway-adress och secret måste fyllas i.");

  const runner=async c=>{try{
    if(location.hostname!=="lanista.se"&&location.hostname!=="www.lanista.se")return alert("Öppna lanista.se innan du kör bokmärket.");
    const get=async u=>{const r=await fetch(u,{credentials:"include"});if(!r.ok)throw new Error(`${u}: HTTP ${r.status}`);return r.json()};
    const unwrap=x=>Array.isArray(x)?x:(x?.data||x?.members||x?.bosses||[]);
    const active=unwrap(await get("/api/clans/2/bosses/active"));
    const available=unwrap(await get("/api/clans/bosses/available"));
    const memberRaw=unwrap(await get("/api/clans/2/members?paginate=false"));

    // Identifiera varje medlem via gladiator-ID, profilnamn och hela stallet.
    // Anropen sker i inloggad webbläsare, inte på Railway.
    const members=[];
    const seen=new Set();
    const profiles=new Map();
    for(const m of memberRaw){
      const avatarId=m?.avatar?.id??m?.avatar_id??m?.id;
      if(!Number.isSafeInteger(Number(avatarId))||Number(avatarId)<=0)continue;
      try{
        const id=Number(avatarId);
        const detail=await get(`/api/avatars/${id}`);
        const profileName=String(detail?.user_name||detail?.data?.user_name||"").trim();
        const stable=unwrap(await get(`/api/avatars/${id}/stable`));
        for(const g of stable){
          if(g?.clan?.id!==2||g?.deleted_at||g?.is_bot)continue;
          if(seen.has(g.id))continue;
          seen.add(g.id);
          members.push({name:g.name,level:g.current_level??g.display_level,profileName});
        }
      }catch(e){
        console.warn("Kunde inte hämta profil/stall för gladiator",avatarId,e);
        const g=m?.avatar||m;
        if(g?.name&&!seen.has(g.id)){
          seen.add(g.id);
          members.push({name:g.name,level:g.current_level??g.display_level??g.level,profileName:""});
        }
      }
    }

    const availableById=new Map(available.map(v=>[String(v?.id),v]));
    const bosses=[];

    for(const b of active.filter(b=>!b.finished)){
      const enemy=b?.npc_enemy||{};
      const fallback=availableById.get(String(enemy?.id))||{};
      let attempts=[];
      let attemptError="";
      try{
        attempts=unwrap(await get(`/api/clans/2/bosses/${b.id}/attempts`));
      }catch(e){
        attemptError=e.message;
      }

      bosses.push({
        name:enemy?.name||fallback?.name||`Vidunder ${b.id}`,
        minLevel:enemy?.clan_boss_min_level??fallback?.clan_boss_min_level,
        maxLevel:enemy?.clan_boss_max_level??fallback?.clan_boss_max_level,
        health:b?.obfuscated_health||b?.health_display||"okänd hälsa",
        resetsAt:b?.resets_at,
        attemptError,
        attempts:attempts.map(a=>({
          name:a?.avatar?.name||a?.member?.avatar?.name||a?.name,
          createdAt:a?.created_at||a?.createdAt,
          damage:a?.damage_done??a?.damage
        }))
      });
    }

    const response=await fetch(c.url+"/update",{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify({secret:c.secret,mentionMap:c.mentions,generatedAt:new Date().toISOString(),members,bosses})
    });
    const text=await response.text().catch(()=>"");
    if(!response.ok)throw new Error(`Railway ${response.status}: ${text||"okänt fel"}`);
    alert(`Vidunderrapport skickad till Discord. ${bosses.length} aktiva vidunder hittades.`);
  }catch(e){
    console.error(e);
    alert("Vidunderbot-fel: "+e.message);
  }};

  document.getElementById("output").textContent="javascript:("+runner.toString()+")("+JSON.stringify(cfg)+")";
};
</script></body></html>
